apis:
  - aid: dex:grpc-api
    name: Dex gRPC API
    description: >-
      gRPC management API for Dex covering OAuth2 client lifecycle (Create,
      Get, Update, Delete, List), password management (Create, Update, Delete,
      List, Verify), identity provider connector management (Create, Update,
      Delete, List), refresh token listing and revocation, OpenID Connect
      discovery retrieval, and version reporting. The canonical schema lives
      in api/v2/api.proto in the dexidp/dex repository.
