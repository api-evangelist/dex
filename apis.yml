aid: dex
name: Dex
description: >-
  A federated OpenID Connect provider that connects to other identity providers
  through connectors, enabling authentication for applications without handling
  passwords directly. Dex acts as a portal to other identity providers through
  connectors, making it easy to implement SSO across multiple providers. Dex is
  a single Go binary with pluggable storage and ships with a gRPC management API
  (api/v2/api.proto) for managing OAuth2 clients, passwords, connectors, and
  refresh tokens, alongside the standard set of OIDC endpoints.
